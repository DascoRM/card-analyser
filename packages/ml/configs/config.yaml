# ML Service Configuration

server:
  host: "0.0.0.0"
  port: 5000
  debug: true

model:
  backbone: "efficientnetv2-s"
  input_shape: [224, 224, 3]
  num_classes: 10
  weights_path: "models/tfjs/mvp-v1"

preprocessing:
  target_size: [224, 224]
  normalize: true
  detect_card: true

inference:
  batch_size: 1
  confidence_threshold: 0.5

security:
  api_key_header: "X-API-Key"
  # API key will be loaded from environment variable ML_API_KEY
